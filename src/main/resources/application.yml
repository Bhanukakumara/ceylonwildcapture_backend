spring:
  application:
    name: ceylon-wild-capture

  profiles:
    active: dev

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}          # 1 hour in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION} # 7 days in milliseconds

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  return-url: ${STRIPE_RETURN_URL:http://localhost:5173/orders}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/checkout}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

google:
  client-id: ${GOOGLE_CLIENT_ID:placeholder}

